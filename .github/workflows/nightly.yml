name: Nightly

on:
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FOUNDRY_VERSION: v1.5.0

jobs:
  invariants:
    name: Invariants, deep profile
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FOUNDRY_PROFILE: deep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - name: Restore compiler output
        id: forge-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: forge-deep-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'contracts/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', '.gitmodules') }}
          restore-keys: |
            forge-deep-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-

      - name: forge test, invariants
        run: forge test --match-contract Invariant

      - name: Save compiler output
        if: steps.forge-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: ${{ steps.forge-cache.outputs.cache-primary-key }}

  fuzz:
    name: Fuzz, 10,000 runs
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FOUNDRY_FUZZ_RUNS: "10000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
          cache: true

      - name: Restore compiler output
        id: forge-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: forge-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-${{ hashFiles('foundry.toml', 'contracts/**/*.sol', 'test/**/*.sol', 'script/**/*.sol', '.gitmodules') }}
          restore-keys: |
            forge-${{ runner.os }}-${{ env.FOUNDRY_VERSION }}-

      - name: forge test, long fuzz
        # The invariant campaign runs in the job above.
        run: forge test --no-match-contract Invariant

      - name: Save compiler output
        if: steps.forge-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            cache
            out
          key: ${{ steps.forge-cache.outputs.cache-primary-key }}

  halmos-long:
    name: Halmos, no per-query timeout
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      FOUNDRY_TEST: test/shield/halmos
      FOUNDRY_OUT: out-halmos
      FOUNDRY_CACHE_PATH: cache-halmos
      HALMOS_VERSION: "0.3.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Halmos
        run: pip install "halmos==${HALMOS_VERSION}"

      - name: Run every symbolic check
        run: halmos --forge-build-out out-halmos --match-contract 'Halmos$' --solver-timeout-assertion 0
