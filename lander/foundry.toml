# The lander's settlement project: one script and the pool's ABI, no verifier code, so it builds in
# seconds on any machine. forge-std comes from the repository's lib/.
[profile.default]
src = "script"
script = "script"
out = "out"
libs = ["../lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
# verifyBatch on a real proof runs far past the default block gas limit in simulation
gas_limit = 90000000000
memory_limit = 536870912
fs_permissions = [{ access = "read", path = "./" }]
remappings = ["forge-std/=../lib/forge-std/src/"]
